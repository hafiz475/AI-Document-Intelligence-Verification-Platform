name: assureai-prod

services:
  postgres:
    image: pgvector/pgvector:pg17
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-assureai}
      POSTGRES_USER: ${POSTGRES_USER:-assureai}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 10
    shm_size: 128mb
    mem_limit: 768m

  redis:
    image: redis:7.4-alpine
    restart: unless-stopped
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:?set REDIS_PASSWORD}
    command:
      - sh
      - -c
      - exec redis-server --appendonly yes --requirepass "$${REDIS_PASSWORD}"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a \"$${REDIS_PASSWORD}\" ping | grep PONG"]
      interval: 10s
      timeout: 3s
      retries: 10
    mem_limit: 256m

  api:
    build:
      context: ./apps/api
      dockerfile: Dockerfile
      target: runtime
      network: host
    restart: unless-stopped
    environment:
      ASSUREAI_ENVIRONMENT: production
      ASSUREAI_LOG_LEVEL: INFO
      ASSUREAI_CORS_ORIGINS: '["${ASSUREAI_PUBLIC_ORIGIN:?set ASSUREAI_PUBLIC_ORIGIN}"]'
      ASSUREAI_AUTH_MODE: ${ASSUREAI_AUTH_MODE:-development}
      ASSUREAI_SESSION_SECRET: ${ASSUREAI_SESSION_SECRET:?set ASSUREAI_SESSION_SECRET}
      ASSUREAI_SECURE_COOKIES: ${ASSUREAI_SECURE_COOKIES:-false}
      ASSUREAI_OIDC_ISSUER: ${ASSUREAI_OIDC_ISSUER:-}
      ASSUREAI_OIDC_AUDIENCE: ${ASSUREAI_OIDC_AUDIENCE:-}
      ASSUREAI_OIDC_JWKS_URL: ${ASSUREAI_OIDC_JWKS_URL:-}
      ASSUREAI_HTTPS_ENABLED: ${ASSUREAI_HTTPS_ENABLED:-false}
      ASSUREAI_DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-assureai}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-assureai}
      ASSUREAI_REDIS_URL: redis://:${REDIS_PASSWORD}@redis:6379/0
      ASSUREAI_STORAGE_PATH: /data/documents
      ASSUREAI_STORAGE_PROVIDER: ${ASSUREAI_STORAGE_PROVIDER:-local}
      ASSUREAI_AZURE_STORAGE_ACCOUNT_URL: ${ASSUREAI_AZURE_STORAGE_ACCOUNT_URL:-}
      ASSUREAI_AZURE_STORAGE_CONTAINER: ${ASSUREAI_AZURE_STORAGE_CONTAINER:-documents}
      ASSUREAI_SECRET_STORE_PROVIDER: ${ASSUREAI_SECRET_STORE_PROVIDER:-environment}
      ASSUREAI_KEY_VAULT_URL: ${ASSUREAI_KEY_VAULT_URL:-}
      ASSUREAI_MALWARE_SCANNER: ${ASSUREAI_MALWARE_SCANNER:-disabled}
      ASSUREAI_CLAMAV_HOST: ${ASSUREAI_CLAMAV_HOST:-clamav}
      ASSUREAI_CLAMAV_PORT: ${ASSUREAI_CLAMAV_PORT:-3310}
      ASSUREAI_METRICS_TOKEN: ${ASSUREAI_METRICS_TOKEN:-}
      ASSUREAI_OTEL_SERVICE_NAME: ${ASSUREAI_OTEL_SERVICE_NAME:-assureai-api}
      ASSUREAI_OTEL_EXPORTER_OTLP_ENDPOINT: ${ASSUREAI_OTEL_EXPORTER_OTLP_ENDPOINT:-}
      ASSUREAI_AI_PROVIDER: ${ASSUREAI_AI_PROVIDER:-development}
      ASSUREAI_OPENAI_API_KEY: ${ASSUREAI_OPENAI_API_KEY:-}
      ASSUREAI_OPENAI_API_KEY_REF: ${ASSUREAI_OPENAI_API_KEY_REF:-}
      ASSUREAI_OPENAI_MODEL: ${ASSUREAI_OPENAI_MODEL:-gpt-4o-mini}
      ASSUREAI_EMBEDDING_PROVIDER: ${ASSUREAI_EMBEDDING_PROVIDER:-development}
      ASSUREAI_EMBEDDING_DIMENSIONS: ${ASSUREAI_EMBEDDING_DIMENSIONS:-64}
      ASSUREAI_EMBEDDING_BATCH_SIZE: ${ASSUREAI_EMBEDDING_BATCH_SIZE:-32}
      ASSUREAI_OPENAI_EMBEDDING_MODEL: ${ASSUREAI_OPENAI_EMBEDDING_MODEL:-text-embedding-3-small}
    volumes:
      - document-data:/data/documents
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/ready', timeout=2)"]
      interval: 15s
      timeout: 3s
      retries: 10
    mem_limit: 512m

  worker:
    build:
      context: .
      dockerfile: apps/worker/Dockerfile
      network: host
    restart: unless-stopped
    command: ["dramatiq", "--processes", "1", "--threads", "2", "assureai_worker.tasks"]
    environment:
      ASSUREAI_ENVIRONMENT: production
      ASSUREAI_AUTH_MODE: ${ASSUREAI_AUTH_MODE:-development}
      ASSUREAI_SESSION_SECRET: ${ASSUREAI_SESSION_SECRET:?set ASSUREAI_SESSION_SECRET}
      ASSUREAI_OIDC_ISSUER: ${ASSUREAI_OIDC_ISSUER:-}
      ASSUREAI_OIDC_AUDIENCE: ${ASSUREAI_OIDC_AUDIENCE:-}
      ASSUREAI_OIDC_JWKS_URL: ${ASSUREAI_OIDC_JWKS_URL:-}
      ASSUREAI_DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-assureai}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-assureai}
      ASSUREAI_REDIS_URL: redis://:${REDIS_PASSWORD}@redis:6379/0
      ASSUREAI_STORAGE_PATH: /data/documents
      ASSUREAI_STORAGE_PROVIDER: ${ASSUREAI_STORAGE_PROVIDER:-local}
      ASSUREAI_AZURE_STORAGE_ACCOUNT_URL: ${ASSUREAI_AZURE_STORAGE_ACCOUNT_URL:-}
      ASSUREAI_AZURE_STORAGE_CONTAINER: ${ASSUREAI_AZURE_STORAGE_CONTAINER:-documents}
      ASSUREAI_SECRET_STORE_PROVIDER: ${ASSUREAI_SECRET_STORE_PROVIDER:-environment}
      ASSUREAI_KEY_VAULT_URL: ${ASSUREAI_KEY_VAULT_URL:-}
      ASSUREAI_AI_PROVIDER: ${ASSUREAI_AI_PROVIDER:-development}
      ASSUREAI_OPENAI_API_KEY: ${ASSUREAI_OPENAI_API_KEY:-}
      ASSUREAI_OPENAI_API_KEY_REF: ${ASSUREAI_OPENAI_API_KEY_REF:-}
      ASSUREAI_OPENAI_MODEL: ${ASSUREAI_OPENAI_MODEL:-gpt-4o-mini}
      ASSUREAI_EMBEDDING_PROVIDER: ${ASSUREAI_EMBEDDING_PROVIDER:-development}
      ASSUREAI_EMBEDDING_DIMENSIONS: ${ASSUREAI_EMBEDDING_DIMENSIONS:-64}
      ASSUREAI_EMBEDDING_BATCH_SIZE: ${ASSUREAI_EMBEDDING_BATCH_SIZE:-32}
      ASSUREAI_OPENAI_EMBEDDING_MODEL: ${ASSUREAI_OPENAI_EMBEDDING_MODEL:-text-embedding-3-small}
      ASSUREAI_OTEL_SERVICE_NAME: ${ASSUREAI_WORKER_OTEL_SERVICE_NAME:-assureai-worker}
      ASSUREAI_OTEL_EXPORTER_OTLP_ENDPOINT: ${ASSUREAI_OTEL_EXPORTER_OTLP_ENDPOINT:-}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - document-data:/data/documents
    mem_limit: 1g

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
      target: production
      network: host
      args:
        VITE_API_BASE_URL: /
    restart: unless-stopped
    ports:
      - "80:8080"
    depends_on:
      api:
        condition: service_healthy
    mem_limit: 128m

volumes:
  postgres-data:
  redis-data:
  document-data:
