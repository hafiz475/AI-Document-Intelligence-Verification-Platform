name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg17
        env:
          POSTGRES_DB: assureai_ci
          POSTGRES_USER: assureai
          POSTGRES_PASSWORD: assureai-ci-password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U assureai -d assureai_ci"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    defaults:
      run:
        working-directory: apps/api
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: apps/api/pyproject.toml
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -e ".[dev]"
      - run: ruff check .
      - run: ruff format --check .
      - run: mypy src tests
      - run: pytest
      - run: alembic upgrade head
        env:
          ASSUREAI_DATABASE_URL: sqlite:///./migration-check.db
      - name: Validate PostgreSQL pgvector migration
        run: alembic upgrade head
        env:
          ASSUREAI_DATABASE_URL: postgresql+psycopg://assureai:assureai-ci-password@localhost:5432/assureai_ci

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - run: npm ci
      - run: npm run format:check
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test -- --run
      - run: npm run build

  compose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker compose config --quiet
      - run: >-
          docker compose
          --env-file .env.production.example
          -f docker-compose.prod.yml
          config --quiet
