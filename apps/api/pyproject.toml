[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "assureai-api"
version = "0.1.0"
description = "AssureAI HTTP API and shared application package"
requires-python = ">=3.12"
dependencies = [
  "alembic>=1.14,<2.0",
  "dramatiq[redis]>=1.17,<3.0",
  "fastapi>=0.115,<1.0",
  "openai>=2.7,<3.0",
  "pgvector>=0.3,<1.0",
  "pypdf>=5.1,<6.0",
  "pydantic-settings>=2.7,<3.0",
  "psycopg[binary]>=3.2,<4.0",
  "python-docx>=1.1,<2.0",
  "python-multipart>=0.0.18,<1.0",
  "sqlalchemy>=2.0,<3.0",
  "uvicorn[standard]>=0.34,<1.0",
]

[project.optional-dependencies]
dev = [
  "httpx>=0.28,<1.0",
  "mypy>=1.14,<2.0",
  "pytest>=8.3,<9.0",
  "pytest-asyncio>=0.25,<1.0",
  "ruff>=0.9,<1.0",
]
worker = [
  # Kept as a compatibility extra; worker dependencies are runtime dependencies.
]

[tool.hatch.build.targets.wheel]
packages = ["src/assureai_api"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "ASYNC"]

[tool.mypy]
python_version = "3.12"
strict = true
plugins = ["pydantic.mypy"]

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]
asyncio_mode = "auto"
